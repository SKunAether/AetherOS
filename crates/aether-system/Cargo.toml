# aether-system — 系统引擎层
# 封装所有 Windows 底层 API，向上层提供安全、统一的系统操作接口。
# 设计原则：所有底层操作统一收敛到该层，上层 Provider 不直接调用 Windows API。
[package]
name = "aether-system"
version = "0.1.0"
edition = "2021"
description = "AetherOS system engine layer: Windows API wrappers (registry, process, service, filesystem, hardware)"

[dependencies]
aether-core = { path = "../aether-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
windows = { workspace = true }
