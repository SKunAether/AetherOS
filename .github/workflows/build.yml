# 提交构建校验工作流（AetherOS 2.0 — Rust + Tauri + React）
# 触发：push 到 main/master + 所有 PR
# 内容：Rust 格式检查、Clippy 静态检查、单元测试、前端 Lint 与构建验证，拦截不合格代码。
name: Build

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  RUSTFLAGS: '-D warnings'

jobs:
  backend:
    name: Rust (core + runtime + system)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  frontend:
    name: Frontend (React + TS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check & build
        run: pnpm build
