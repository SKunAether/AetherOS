# 正式发布工作流（AetherOS 2.0）
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop/frontend
        run: pnpm build

      - name: Build installer (tauri)
        working-directory: apps/desktop
        run: pnpm --filter @aetheros/desktop-frontend exec tauri build

      - name: Generate update manifest
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $setup = Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $sha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            version = $version
            notes = "AetherOS Guardian $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = ""
                url = "https://github.com/${{ github.repository }}/releases/latest/download/$($setup.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content installer/update-manifest.json -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            installer/update-manifest.json
          generate_release_notes: true